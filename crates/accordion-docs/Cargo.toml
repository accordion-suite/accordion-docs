[package]
name = "accordion-docs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The sandbox launcher on its own, for the picture tests.
[[bin]]
name = "accordion-docs-sandbox"
path = "src/bin/sandbox.rs"
test = false

[dependencies]
accordion-core = { git = "https://github.com/accordion-suite/accordion-core", version = "0.1.0" }
accordion-module = { git = "https://github.com/accordion-suite/accordion-core", version = "0.1.0" }
accordion-sandbox = { git = "https://github.com/accordion-suite/accordion-core", version = "0.1.0" }
accordion-types = { git = "https://github.com/accordion-suite/accordion-core", version = "0.1.0" }
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
# The tree scraper parses HTML into.
ego-tree = "0.11.1"
# When comments were written.
jiff = { version = "1.0.0", default-features = false, features = ["std"] }
# Reads Markdown files people open with Docs, as GitHub reads them.
pulldown-cmark = { version = "0.13.0", default-features = false, features = ["html"] }
# Reads Word files people open with Docs, in the sandbox.
quick-xml = "0.42.0"
# Reads documents' HTML as browsers do, including HTML other programs wrote.
scraper = { version = "0.29.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.53.3", features = ["io-util", "macros", "rt", "sync", "time"] }
tracing = "0.1.44"
# Comments' IDs, and the version their writes into a file make.
uuid = { version = "1.28.0", features = ["v7"] }
yrs = "0.28.1"
# Packs Word and OpenDocument downloads.
zip = { version = "9.2.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
futures-util = "0.3.34"
http-body-util = "0.1.5"
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread"] }
tokio-tungstenite = "0.30.0"
tower = { version = "0.5.3", features = ["util"] }
